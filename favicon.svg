<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c89466"/>
      <stop offset="1" stop-color="#a3713f"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- subtle "tap / plate" rings -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="8"/>

  <g fill="#fdfbf7">
    <!-- Fork -->
    <rect x="171" y="150" width="11" height="74" rx="5.5"/>
    <rect x="192" y="150" width="11" height="74" rx="5.5"/>
    <rect x="213" y="150" width="11" height="74" rx="5.5"/>
    <path d="M171 214 h53 a0 0 0 0 1 0 0 v6 a26 26 0 0 1 -26 26 h-1 a26 26 0 0 1 -26 -26 z"/>
    <rect x="190.5" y="244" width="14" height="120" rx="7"/>

    <!-- Knife -->
    <path d="M333 150
             c22 8 22 64 8 96
             c-5 11 -16 12 -16 0
             v-90
             c0 -8 8 -9 8 -6 z"/>
